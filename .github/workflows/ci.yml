name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmcell-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    name: Windows Core / Self-hosted
    runs-on:
      - self-hosted
      - Windows
      - X64
      - jerry-ci
      - jerry-ci-win
      - vm-cell-manager
      - core
      - trusted

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Runner diagnostics
        shell: pwsh
        run: |
          Write-Host "identity=$(whoami)"
          Write-Host "computer=$env:COMPUTERNAME"

          Get-Command git |
            Select-Object Name, Source |
            Format-Table -AutoSize

          Get-Command cargo |
            Select-Object Name, Source |
            Format-Table -AutoSize

          git --version
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features
