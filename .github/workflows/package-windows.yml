name: Package Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmcell-package-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-windows:
    name: Portable Windows / Self-hosted
    runs-on:
      - self-hosted
      - Windows
      - X64
      - jerry-ci
      - jerry-ci-win
      - vm-cell-manager
      - core
      - trusted
    timeout-minutes: 30

    env:
      CARGO_HOME: C:\ProgramData\jerry-ci\cargo
      RUSTUP_HOME: C:\ProgramData\jerry-ci\rustup
      RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
      EXPECTED_RUNNER_NAME: jerry-ci-win-01-vm-cell-manager
      EXPECTED_GIT: C:\ProgramData\jerry-ci\git\cmd\git.exe
      EXPECTED_CARGO_HOME: C:\ProgramData\jerry-ci\cargo
      EXPECTED_RUSTUP_HOME: C:\ProgramData\jerry-ci\rustup
      EXPECTED_RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source and output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne '${{ github.sha }}') { throw 'checkout SHA mismatch' }

          $identity = (whoami).Trim().ToLowerInvariant()
          $git = (@(Get-Command git -CommandType Application -ErrorAction Stop)[0]).Source
          $cargo = (@(Get-Command cargo -CommandType Application -ErrorAction Stop)[0]).Source
          $rustc = (@(Get-Command rustc -CommandType Application -ErrorAction Stop)[0]).Source
          if ($env:RUNNER_NAME -ne $env:EXPECTED_RUNNER_NAME -or
              $env:RUNNER_OS -ne 'Windows' -or
              $env:RUNNER_ARCH -ne 'X64' -or
              $identity -ne 'nt authority\network service') {
            throw 'dedicated packaging runner identity mismatch'
          }
          if (-not [string]::Equals(
              $git,
              $env:EXPECTED_GIT,
              [StringComparison]::OrdinalIgnoreCase
          ) -or
              $env:CARGO_HOME -ne $env:EXPECTED_CARGO_HOME -or
              $env:RUSTUP_HOME -ne $env:EXPECTED_RUSTUP_HOME -or
              $env:RUSTUP_TOOLCHAIN -ne $env:EXPECTED_RUSTUP_TOOLCHAIN) {
            throw 'dedicated packaging toolchain configuration mismatch'
          }
          $expectedCargoBin = Join-Path $env:EXPECTED_CARGO_HOME 'bin'
          foreach ($path in @($cargo, $rustc)) {
            if (-not $path.StartsWith(
                "$expectedCargoBin\",
                [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "dedicated Rust executable path mismatch: $path"
            }
          }
          rustc --version
          cargo --version

          $metadata = cargo metadata --locked --no-deps --format-version 1 |
            ConvertFrom-Json
          $package = @($metadata.packages | Where-Object name -eq 'vm-cell-manager')
          if ($package.Count -ne 1) { throw 'Cargo package metadata was ambiguous' }

          $target = Join-Path $env:RUNNER_TEMP 'vmcell-package-target'
          $output = Join-Path $env:RUNNER_TEMP 'vmcell-package-output'
          New-Item -ItemType Directory -Path $target, $output -Force | Out-Null
          $sourceDateEpoch = (git show -s --format=%ct '${{ github.sha }}').Trim()

          "CARGO_TARGET_DIR=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VMCELL_PACKAGE_VERSION=$($package[0].version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VMCELL_PACKAGE_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VMCELL_SOURCE_DATE_EPOCH=$sourceDateEpoch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build locked release binary
        shell: pwsh
        run: cargo build --locked --release --bin vmcell

      - name: Package and verify deterministic output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:CARGO_TARGET_DIR 'release\vmcell.exe'
          & .\tools\test-windows-package.ps1 `
            -BinaryPath $binary `
            -Version $env:VMCELL_PACKAGE_VERSION
          & .\tools\package-windows.ps1 `
            -BinaryPath $binary `
            -OutputDirectory $env:VMCELL_PACKAGE_OUTPUT `
            -Version $env:VMCELL_PACKAGE_VERSION `
            -SourceCommit '${{ github.sha }}' `
            -SourceDateEpoch $env:VMCELL_SOURCE_DATE_EPOCH

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: vmcell-v${{ env.VMCELL_PACKAGE_VERSION }}-windows-x86_64
          path: ${{ env.VMCELL_PACKAGE_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
