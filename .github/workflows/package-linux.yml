name: Package Linux

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact trusted repository commit to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vmcell-package-linux-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  portable-linux:
    name: Portable Linux / GitHub-hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      EXPECTED_RUSTC: rustc 1.85.0 (4d91de4e4 2025-02-17)
      EXPECTED_CARGO_PREFIX: cargo 1.85.0

    steps:
      - name: Validate requested source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi

      - name: Checkout exact supplied SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind clean hosted build state
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "${RUNNER_ENVIRONMENT:-}" = 'github-hosted'
          test "${RUNNER_OS:-}" = 'Linux'
          test "${RUNNER_ARCH:-}" = 'X64'
          test "$(uname -s)" = 'Linux'
          test "$(uname -m)" = 'x86_64'
          . /etc/os-release
          test "$ID" = 'ubuntu'
          test "$VERSION_ID" = '24.04'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cargo_home="$RUNNER_TEMP/vmcell-package-linux-cargo"
          rustup_home="$RUNNER_TEMP/vmcell-package-linux-rustup"
          cargo_target="$RUNNER_TEMP/vmcell-package-linux-target"
          output_parent="$RUNNER_TEMP/vmcell-package-linux-output"
          for path in "$cargo_home" "$rustup_home" "$cargo_target" "$output_parent"; do
            mkdir -p "$path"
            test "$(realpath "$path")" = "$(realpath "$RUNNER_TEMP")/$(basename "$path")"
          done
          chmod 700 "$output_parent"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\nCARGO_TARGET_DIR=%s\nVMCELL_PACKAGE_PARENT=%s\n' \
            "$cargo_home" "$rustup_home" "$cargo_target" "$output_parent" >> "$GITHUB_ENV"

      - name: Install exact repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          test "$(rustc --version)" = "$EXPECTED_RUSTC"
          case "$(cargo --version)" in
            "$EXPECTED_CARGO_PREFIX"*) ;;
            *) echo 'cargo version mismatch' >&2; exit 1 ;;
          esac
          cargo fetch --locked

      - name: Build, validate, and package exact source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          cargo build --locked --offline --release --bin vmcell
          metadata="$(cargo metadata --locked --offline --no-deps --format-version 1)"
          version="$(python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[p for p in data["packages"] if p["name"]=="vm-cell-manager"]; assert len(matches)==1; print(matches[0]["version"])' <<< "$metadata")"
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          binary="$CARGO_TARGET_DIR/release/vmcell"
          test "$("$binary" --version)" = "vmcell $version"
          python3 tools/test-linux-package.py --binary "$binary"
          output="$VMCELL_PACKAGE_PARENT/artifact"
          python3 tools/package-linux.py \
            --binary "$binary" \
            --output-directory "$output" \
            --version "$version" \
            --source-commit "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --glibc-floor GLIBC_2.39
          archive="$output/vmcell-v${version}-linux-x86_64.tar.gz"
          checksum="$output/SHA256SUMS.txt"
          test -f "$archive"
          test -f "$checksum"
          (cd "$output" && sha256sum --check SHA256SUMS.txt)
          printf 'VMCELL_PACKAGE_VERSION=%s\nVMCELL_PACKAGE_OUTPUT=%s\n' \
            "$version" "$output" >> "$GITHUB_ENV"

      - name: Prove package build was repository-read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test ! -e "$GITHUB_WORKSPACE/target"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vmcell-v${{ env.VMCELL_PACKAGE_VERSION }}-linux-x86_64
          path: |
            ${{ env.VMCELL_PACKAGE_OUTPUT }}/vmcell-v${{ env.VMCELL_PACKAGE_VERSION }}-linux-x86_64.tar.gz
            ${{ env.VMCELL_PACKAGE_OUTPUT }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
