name: Windows Validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact trusted repository commit to validate
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: Exact trusted repository commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vmcell-windows-validation-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  windows-correctness:
    name: Windows Correctness / GitHub-hosted
    if: github.repository == 'JerrySkywalker/vm-cell-manager' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 45

    env:
      RUSTUP_TOOLCHAIN: 1.85.0-x86_64-pc-windows-msvc
      EXPECTED_RUSTC: rustc 1.85.0 (4d91de4e4 2025-02-17)
      EXPECTED_CARGO_PREFIX: cargo 1.85.0

    steps:
      - name: Validate requested source identity
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be exactly 40 lowercase hexadecimal characters'
          }
          if ($env:SOURCE_SHA -cne $env:WORKFLOW_SHA -or
              $env:SOURCE_SHA -cne $env:JOB_WORKFLOW_SHA) {
            throw 'source_sha must equal the caller and reusable workflow SHA'
          }
          $startedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "VMCELL_HOSTED_STARTED_EPOCH=$startedAt" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout exact supplied SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind ephemeral Windows build state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoHome = Join-Path $env:RUNNER_TEMP 'vmcell-windows-cargo'
          $rustupHome = Join-Path $env:RUNNER_TEMP 'vmcell-windows-rustup'
          $cargoTarget = Join-Path $env:RUNNER_TEMP 'vmcell-windows-target'
          foreach ($path in @($cargoHome, $rustupHome, $cargoTarget)) {
            [IO.Directory]::CreateDirectory($path) | Out-Null
            $parent = [IO.Path]::GetFullPath((Split-Path -Parent $path))
            if ($parent -ne [IO.Path]::GetFullPath($env:RUNNER_TEMP)) {
              throw 'ephemeral Windows build path escaped RUNNER_TEMP'
            }
          }
          "CARGO_HOME=$cargoHome" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$rustupHome" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove hosted baseline and exact source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -cne $env:SOURCE_SHA) { throw 'checkout SHA mismatch' }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'runner is not GitHub-hosted' }
          if ($env:RUNNER_OS -cne 'Windows') { throw 'runner OS mismatch' }
          if ($env:RUNNER_ARCH -cne 'X64') { throw 'runner architecture mismatch' }
          if ([IO.Path]::GetFullPath($env:CARGO_TARGET_DIR) -ne
              [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'vmcell-windows-target'))) {
            throw 'Cargo target binding mismatch'
          }
          if ((git status --porcelain=v1 --untracked-files=all)) {
            throw 'checkout was not clean before validation'
          }
          Write-Host "source_sha=$actualSha"
          Write-Host 'runner_environment=github-hosted'
          Write-Host 'os=Windows'
          Write-Host 'architecture=X64'
          Write-Host 'image=windows-2025'

      - name: Install exact declared Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUSTUP_TOOLCHAIN `
            --profile minimal `
            --component rustfmt,clippy
          if ((rustc --version).Trim() -cne $env:EXPECTED_RUSTC) {
            throw 'rustc version mismatch'
          }
          if (-not (cargo --version).Trim().StartsWith(
              $env:EXPECTED_CARGO_PREFIX,
              [StringComparison]::Ordinal)) {
            throw 'cargo version mismatch'
          }
          rustfmt --version
          cargo-clippy --version

      - name: Bind Cargo source and MSRV contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'locked dependency fetch failed' }
          $metadata = cargo metadata --locked --no-deps --format-version 1 |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'locked Cargo metadata failed' }
          $package = @($metadata.packages | Where-Object name -eq 'vm-cell-manager')
          if ($package.Count -ne 1) { throw 'Cargo package metadata was ambiguous' }
          if ($package[0].rust_version -cne '1.85.0') {
            throw 'Cargo rust-version does not bind the hosted toolchain'
          }
          "VMCELL_PACKAGE_VERSION=$($package[0].version)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Format
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'format gate failed' }

      - name: PowerShell AST and static safety
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\check-powershell.ps1
          & .\tools\test-ci-timing.ps1

      - name: Windows WHPX preflight contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\test-windows-whpx-preflight.ps1

      - name: Windows validation workflow contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\test-windows-validation-workflow.ps1

      - name: Linux validation workflow contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\test-linux-validation-workflow.ps1

      - name: Linux reliability workflow contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\test-linux-reliability-workflow.ps1

      - name: Locked static check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --locked --offline --workspace --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { throw 'locked static check failed' }

      - name: Clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --locked --offline --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy gate failed' }

      - name: Full tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --offline --workspace --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { throw 'full test gate failed' }

      - name: Documentation tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --offline --workspace --all-features --doc
          if ($LASTEXITCODE -ne 0) { throw 'documentation test gate failed' }

      - name: Portable Windows package contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --offline --release --bin vmcell
          if ($LASTEXITCODE -ne 0) { throw 'locked package build failed' }
          $metadata = cargo metadata --locked --offline --no-deps --format-version 1 |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'locked package metadata failed' }
          $package = @($metadata.packages | Where-Object name -eq 'vm-cell-manager')
          if ($package.Count -ne 1 -or
              $package[0].version -cne $env:VMCELL_PACKAGE_VERSION) {
            throw 'Cargo package identity changed during validation'
          }
          $binary = Join-Path $env:CARGO_TARGET_DIR 'release\vmcell.exe'
          & .\tools\test-windows-package.ps1 `
            -BinaryPath $binary `
            -Version $env:VMCELL_PACKAGE_VERSION

      - name: Prove validation was repository-read-only
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'target')) {
            throw 'validation wrote a target directory inside the checkout'
          }
          if ((git status --porcelain=v1 --untracked-files=all)) {
            throw 'validation changed the checkout'
          }

      - name: Sanitized Windows correctness terminal summary
        if: always()
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:JOB_STATUS -notin @('success', 'failure', 'cancelled')) {
            throw 'Windows correctness receipt inputs were invalid'
          }
          $startedAt = 0L
          if (-not [long]::TryParse($env:VMCELL_HOSTED_STARTED_EPOCH, [ref] $startedAt)) {
            $startedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          }
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $startedAt
          $elapsed = [Math]::Min([Math]::Max($elapsed, 0), 2700)
          $receipt = 'vmcell.windows-correctness-receipt.v1 ' +
            "source_sha=$($env:SOURCE_SHA) observed_steps_status=$($env:JOB_STATUS) " +
            "elapsed_seconds=$elapsed " +
            'runner=github-hosted image=windows-2025 architecture=X64 ' +
            'toolchain=1.85.0-x86_64-pc-windows-msvc ' +
            'repository_correctness_claim=false r4_runner_health=false ' +
            'real_platform_acceptance=false support_promotion=false'
          [IO.File]::AppendAllText(
            $env:GITHUB_STEP_SUMMARY,
            $receipt + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )
