name: Bug report
description: Report a reproducible VM Cell Manager defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve VM Cell Manager. Do not include secrets, license keys, or private VM images.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host platform
      options:
        - Windows
        - Linux
        - macOS (post-v1 modeled vocabulary)
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: hyperv, qemu/kvm, qemu/whpx, qemu/hvf (post-v1)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
