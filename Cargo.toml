[package]
name = "vm-cell-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "A Rust-first, daemonless local execution-cell runtime for disposable full-system VMs."
license = "Apache-2.0"
repository = "https://github.com/JerrySkywalker/vm-cell-manager"
readme = "README.md"
keywords = ["virtualization", "hyper-v", "qemu", "vm", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "vm_cell_manager"
path = "src/lib.rs"

[[bin]]
name = "vmcell"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.10", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.12"
